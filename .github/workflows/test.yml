# Every suite, every push. `npm test` runs core/test/run.mjs, which runs each
# suite in its own process under two timezones and reports every failure, so a
# Monday-only assertion can never hide a green suite behind it again.
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
